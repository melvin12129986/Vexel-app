<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexel Gameshop - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#b7e7f3] text-slate-800 min-h-screen">

  <nav class="bg-[#008bd0] p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <img src="2.png" alt="Vexel Logo" class="h-10 w-auto rounded-lg">
        <div>
          <h1 class="text-xl font-bold text-[#f5ebe6] leading-none">Vexel</h1>
          <span class="text-[10px] text-yellow-200 tracking-widest uppercase">Gameshop</span>
        </div>
      </div>
      
      <div class="w-full md:w-1/2">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Cari skin, weapon, atau nama game..." 
          class="w-full px-4 py-2 rounded-xl bg-white/90 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-yellow-300 text-sm shadow-inner"
          onkeyup="searchItems()"
        >
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-8">
    <section>
      <h2 class="text-lg font-bold mb-4 border-l-4 border-[#008bd0] pl-3 text-slate-900">✨ Item Populer Ditransaksikan</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="popularList"></div>
    </section>

    <section>
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
        <h2 class="text-lg font-bold border-l-4 border-[#008bd0] pl-3 text-slate-900">🎮 Katalog Item Trade</h2>
        <select id="categoryFilter" onchange="searchItems()" class="bg-white border border-sky-300 text-sm rounded-xl p-2 focus:ring-2 focus:ring-[#008bd0] text-slate-800 shadow-sm">
          <option value="ALL">Semua Tipe Item</option>
          <option value="Skin">Skin / Cosmetic</option>
          <option value="Weapon">Weapon / Equipment</option>
          <option value="Currency">In-Game Currency</option>
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="itemList"></div>
    </section>
  </main>

  <script>
    const products = [
      { id: 1, name: "Awakened Divine Orb", game: "Path of Exile", category: "Currency", price: 8500, tradeMethod: "Party Face-to-Face", popular: true },
      { id: 2, name: "AK-47 | Redline (Field-Tested)", game: "CS:GO / CS2", category: "Weapon", price: 210000, tradeMethod: "Steam Trade Offer", popular: true },
      { id: 3, name: "Dragonclaw Hook", game: "Dota 2", category: "Skin", price: 2450000, tradeMethod: "Direct Steam Trade", popular: true },
      { id: 4, name: "1.000.000 Gold", game: "World of Warcraft", category: "Currency", price: 150000, tradeMethod: "In-Game Mail / Trade", popular: false },
      { id: 5, name: "Knife | Karambit Fade (FN)", game: "CS:GO / CS2", category: "Weapon", price: 18500000, tradeMethod: "Steam Trade Offer", popular: true },
      { id: 6, name: "Arcana Manifold Paradox", game: "Dota 2", category: "Skin", price: 420000, tradeMethod: "Steam Trade Offer", popular: false }
    ];

    function renderProducts(itemsToRender = products) {
      const popularContainer = document.getElementById('popularList');
      const allContainer = document.getElementById('itemList');
      
      popularContainer.innerHTML = '';
      allContainer.innerHTML = '';

      itemsToRender.filter(p => p.popular).forEach(item => {
        popularContainer.innerHTML += createCardHTML(item);
      });

      itemsToRender.forEach(item => {
        allContainer.innerHTML += createCardHTML(item);
      });
    }

    function createCardHTML(item) {
      return `
        <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-4 border border-sky-200 hover:border-[#008bd0] transition duration-200 cursor-pointer flex flex-col justify-between shadow-md hover:shadow-lg">
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs text-[#008bd0] font-bold">${item.game}</span>
              <span class="text-[10px] bg-sky-100 text-sky-800 px-2 py-0.5 rounded-full border border-sky-300/40">${item.category}</span>
            </div>
            <h3 class="font-bold text-base text-slate-800">${item.name}</h3>
          </div>
          <div class="mt-4 pt-3 border-t border-sky-200/60 flex justify-between items-end">
            <p class="text-[11px] text-slate-500">Metode: ${item.tradeMethod}</p>
            <p class="text-[#008bd0] font-bold text-base">Rp ${item.price.toLocaleString('id-ID')}</p>
          </div>
        </div>
      `;
    }

    function searchItems() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;

      const filtered = products.filter(p => {
        const matchesQuery = p.name.toLowerCase().includes(query) || p.game.toLowerCase().includes(query);
        const matchesCategory = category === 'ALL' || p.category === category;
        return matchesQuery && matchesCategory;
      });

      renderProducts(filtered);
    }

    renderProducts();
  </script>
</body>
</html>
